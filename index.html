<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Insemineringskalkulator</title>

<!-- Installerbar app (Android + iOS) -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2f7d57">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Semin">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">

<style>
    :root {
        --bg: #eef3ec;
        --card: #ffffff;
        --text: #1f2a24;
        --muted: #6b7a70;
        --line: #d9e2da;
        --accent: #2f7d57;
        --accent-dark: #25654a;
        --accent-soft: #e6f3ec;
        --shadow: 0 10px 30px rgba(31, 58, 43, 0.12);
    }
    @media (prefers-color-scheme: dark) {
        :root {
            --bg: #121a15;
            --card: #1b251f;
            --text: #e8efe9;
            --muted: #93a59a;
            --line: #2e3d34;
            --accent: #4aa57a;
            --accent-dark: #3d8a65;
            --accent-soft: #1f3529;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }
    }

    * { box-sizing: border-box; }

    html { background: var(--bg); }

    body {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
        margin: 0;
        min-height: 100vh;
        background:
            radial-gradient(1200px 500px at 50% -150px, var(--accent-soft), transparent 70%),
            var(--bg);
        color: var(--text);
        padding: calc(24px + env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom));
        /* Vi styrer "dra ned for å oppdatere" selv, så det virker likt på Android og iOS */
        overscroll-behavior-y: contain;
        -webkit-tap-highlight-color: transparent;
    }

    .container {
        background: var(--card);
        max-width: 480px;
        margin: 0 auto;
        border-radius: 20px;
        box-shadow: var(--shadow);
        overflow: hidden;
        border: 1px solid var(--line);
    }

    .header {
        background: linear-gradient(135deg, var(--accent), var(--accent-dark));
        color: #fff;
        padding: 26px 24px 22px;
        text-align: center;
    }
    .header .icon {
        width: 52px;
        height: 52px;
        margin: 0 auto 10px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.18);
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .header .icon svg { width: 28px; height: 28px; }
    h2 {
        margin: 0;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 0.2px;
    }
    .header p {
        margin: 6px 0 0;
        font-size: 14px;
        opacity: 0.85;
    }

    .body { padding: 22px 24px 26px; }

    .field { margin-bottom: 18px; }

    label {
        display: block;
        font-weight: 600;
        font-size: 14px;
        color: var(--muted);
        margin-bottom: 6px;
        letter-spacing: 0.2px;
    }

    input, select {
        width: 100%;
        padding: 13px 14px;
        border-radius: 12px;
        border: 1.5px solid var(--line);
        background: var(--card);
        color: var(--text);
        font-size: 17px;
        font-family: inherit;
        transition: border-color 0.15s, box-shadow 0.15s;
        -webkit-appearance: none;
        appearance: none;
    }
    select {
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='9' viewBox='0 0 14 9'><path d='M1 1l6 6 6-6' fill='none' stroke='%236b7a70' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/></svg>");
        background-repeat: no-repeat;
        background-position: right 14px center;
        padding-right: 38px;
    }
    input:focus, select:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 4px var(--accent-soft);
    }

    .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
    }
    @media (max-width: 380px) {
        .row { grid-template-columns: 1fr; }
    }

    button {
        width: 100%;
        padding: 15px;
        margin-top: 4px;
        border: none;
        border-radius: 12px;
        background: linear-gradient(135deg, var(--accent), var(--accent-dark));
        color: #fff;
        font-size: 17px;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
        box-shadow: 0 6px 14px rgba(47, 125, 87, 0.3);
        transition: transform 0.1s, box-shadow 0.15s;
    }
    button:hover { box-shadow: 0 8px 18px rgba(47, 125, 87, 0.4); }
    button:active {
        transform: translateY(1px);
        box-shadow: 0 3px 8px rgba(47, 125, 87, 0.3);
    }

    #resultat {
        display: none;
        margin-top: 22px;
        padding: 20px 16px;
        border-radius: 16px;
        background: var(--accent-soft);
        border: 1.5px solid var(--accent);
        text-align: center;
        animation: pop 0.25s ease-out;
    }
    #resultat .label {
        font-size: 14px;
        font-weight: 600;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 1px;
    }
    #resultat .tid {
        display: block;
        font-size: 52px;
        font-weight: 800;
        line-height: 1.1;
        margin-top: 4px;
        color: var(--accent);
        font-variant-numeric: tabular-nums;
    }
    @keyframes pop {
        from { opacity: 0; transform: translateY(6px) scale(0.98); }
        to   { opacity: 1; transform: none; }
    }

    footer {
        text-align: center;
        margin-top: 24px;
        font-size: 0.85em;
        color: var(--muted);
    }

    /* Dra ned for å oppdatere */
    #ptr {
        position: fixed;
        top: 0;
        left: 50%;
        width: 44px;
        height: 44px;
        margin-left: -22px;
        margin-top: calc(env(safe-area-inset-top) - 54px);
        border-radius: 50%;
        background: var(--card);
        border: 1px solid var(--line);
        box-shadow: var(--shadow);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 50;
        pointer-events: none;
        opacity: 0;
    }
    #ptr svg { width: 22px; height: 22px; stroke: var(--accent); fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; transition: transform 0.1s; }
    #ptr.spinner svg { animation: snurr 0.8s linear infinite; }
    @keyframes snurr { to { transform: rotate(360deg); } }

    /* Installasjonstips */
    #installTips {
        display: none;
        max-width: 480px;
        margin: 16px auto 0;
        padding: 14px 16px;
        border-radius: 14px;
        background: var(--card);
        border: 1px solid var(--line);
        font-size: 14px;
        color: var(--muted);
        line-height: 1.45;
    }
    #installTips strong { color: var(--text); }
    #installTips button {
        margin-top: 10px;
        padding: 11px;
        font-size: 15px;
    }
    #installTips .lukk {
        display: block;
        margin: 8px auto 0;
        background: none;
        border: none;
        box-shadow: none;
        color: var(--muted);
        font-size: 13px;
        font-weight: 500;
        padding: 6px;
        width: auto;
        text-decoration: underline;
    }
</style>
</head>

<body>

<div id="ptr" aria-hidden="true">
    <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><polyline points="20 4 20 9 15 9"/></svg>
</div>

<div class="container">

    <div class="header">
        <div class="icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="9"/>
                <polyline points="12 7 12 12 15.5 14"/>
            </svg>
        </div>
        <h2>Insemineringskalkulator</h2>
        <p>Finn riktig tidspunkt etter brunststart</p>
    </div>

    <div class="body">
        <div class="row">
            <div class="field">
                <label for="ikkeBrunst">Ikke brunst kl</label>
                <input type="time" id="ikkeBrunst">
            </div>
            <div class="field">
                <label for="brunstOppdaget">Brunst oppdaget kl</label>
                <input type="time" id="brunstOppdaget">
            </div>
        </div>

        <div class="field">
            <label for="gruppe">Velg dyregruppe</label>
            <select id="gruppe">
                <option value="18">Påsett (18 timer)</option>
                <option value="21">Gimre (21 timer)</option>
                <option value="24">Søye (24 timer)</option>
            </select>
        </div>

        <button onclick="beregn()">Beregn tidspunkt for inseminering</button>

        <div id="resultat"></div>
    </div>

</div>

<div id="installTips"></div>

<script>
function parseTid(t) {
    const deler = t.split(":");
    return parseInt(deler[0]) + parseInt(deler[1]) / 60;
}

function formatTid(t) {
    t = ((t % 24) + 24) % 24;
    let h = Math.floor(t);
    let m = Math.round((t - h) * 60);
    if (m === 60) { h++; m = 0; }
    if (h === 24) h = 0;
    return (h < 10 ? "0" : "") + h + ":" + (m < 10 ? "0" : "") + m;
}

function beregn() {
    const ikke = document.getElementById("ikkeBrunst").value;
    const oppdaget = document.getElementById("brunstOppdaget").value;

    if (!ikke || !oppdaget) {
        alert("Du må fylle inn begge tidspunkter.");
        return;
    }

    const timerFraBrunst = parseInt(document.getElementById("gruppe").value);

    const t1 = parseTid(ikke);
    const t2 = parseTid(oppdaget);

    let brunstStart = (t2 < t1)
        ? t1 + (24 + t2 - t1) / 2
        : t1 + (t2 - t1) / 2;

    let inseminering = brunstStart + timerFraBrunst;

    document.getElementById("resultat").style.display = "block";
    document.getElementById("resultat").innerHTML =
        "<div class='label'>Inseminer kl</div><span class='tid'>" + formatTid(inseminering) + "</span>";
}
</script>

<footer>
  © 2025 Kalkulator laget av Johanne Ulrica Øveraasen
</footer>

<script>
/* ---------- Service worker (offline + oppdateringer) ---------- */
let swReg = null;
if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").then(function (reg) {
            swReg = reg;
        }).catch(function () {});
    });
}

/* ---------- Dra ned for å oppdatere ---------- */
(function () {
    const ptr = document.getElementById("ptr");
    const TERSKEL = 80;      // piksler du må dra for å utløse
    const MAKS = 120;
    let startY = 0, dra = false, avstand = 0, opptatt = false;

    function paaToppen() {
        return (window.scrollY || document.documentElement.scrollTop || 0) <= 0;
    }
    function tegn(d) {
        const p = Math.min(d / TERSKEL, 1);
        ptr.style.opacity = p;
        ptr.style.transform = "translateY(" + Math.min(d, MAKS) * 0.9 + "px)";
        ptr.firstElementChild.style.transform = "rotate(" + (d * 3) + "deg)";
    }
    function skjul() {
        ptr.style.transition = "transform 0.2s, opacity 0.2s";
        ptr.style.opacity = 0;
        ptr.style.transform = "translateY(0)";
        setTimeout(function () { ptr.style.transition = ""; ptr.classList.remove("spinner"); ptr.firstElementChild.style.transform = ""; }, 220);
    }

    async function oppdater() {
        opptatt = true;
        ptr.classList.add("spinner");
        ptr.style.transition = "transform 0.15s";
        ptr.style.opacity = 1;
        ptr.style.transform = "translateY(" + (TERSKEL * 0.7) + "px)";
        try {
            if (swReg) { await swReg.update(); }
            if ("caches" in window) {
                const navn = await caches.keys();
                await Promise.all(navn.map(function (n) { return caches.delete(n); }));
            }
        } catch (e) { /* ingen nett – last siden på nytt likevel */ }
        location.reload();
    }

    document.addEventListener("touchstart", function (e) {
        if (opptatt || e.touches.length !== 1 || !paaToppen()) return;
        startY = e.touches[0].clientY;
        dra = true;
        avstand = 0;
    }, { passive: true });

    document.addEventListener("touchmove", function (e) {
        if (!dra || opptatt) return;
        const d = e.touches[0].clientY - startY;
        if (d <= 0 || !paaToppen()) { avstand = 0; tegn(0); return; }
        avstand = d * 0.5;        // litt motstand
        tegn(avstand);
        if (e.cancelable) e.preventDefault();
    }, { passive: false });

    document.addEventListener("touchend", function () {
        if (!dra || opptatt) return;
        dra = false;
        if (avstand >= TERSKEL * 0.75) { oppdater(); } else { skjul(); }
        avstand = 0;
    });
    document.addEventListener("touchcancel", function () { dra = false; skjul(); });
})();

/* ---------- Installasjonstips ---------- */
(function () {
    const boks = document.getElementById("installTips");
    const erInstallert = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
    if (erInstallert) return;
    try { if (localStorage.getItem("skjulInstall") === "1") return; } catch (e) {}

    function lukkKnapp() {
        return "<button class='lukk' type='button' id='lukkTips'>Skjul</button>";
    }
    function vis(html) {
        boks.innerHTML = html;
        boks.style.display = "block";
        document.getElementById("lukkTips").onclick = function () {
            boks.style.display = "none";
            try { localStorage.setItem("skjulInstall", "1"); } catch (e) {}
        };
    }

    const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) ||
                (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

    if (ios) {
        vis("<strong>Legg til på hjem-skjermen</strong><br>" +
            "Trykk på Del-ikonet (firkant med pil opp) i Safari, og velg «Legg til på Hjem-skjerm»." + lukkKnapp());
    }

    // Android / Chrome
    let utsatt = null;
    window.addEventListener("beforeinstallprompt", function (e) {
        e.preventDefault();
        utsatt = e;
        vis("<strong>Installer appen</strong><br>Få kalkulatoren som egen app på telefonen, med eget ikon.<br>" +
            "<button type='button' id='installKnapp'>Installer</button>" + lukkKnapp());
        document.getElementById("installKnapp").onclick = function () {
            utsatt.prompt();
            utsatt.userChoice.finally(function () { boks.style.display = "none"; utsatt = null; });
        };
    });
    window.addEventListener("appinstalled", function () { boks.style.display = "none"; });
})();
</script>

</body>
</html>
